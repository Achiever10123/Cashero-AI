<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#07070f" />
    <title>404 - Page Not Found | Cashero AI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07070f;
        --bg2: #0d0d1a;
        --bg3: #13132a;
        --border: #1e1e3a;
        --border2: #2a2a52;
        --text: #e8e8f8;
        --text2: #8888b0;
        --text3: #555570;
        --accent: #6c47ff;
        --accent2: #9d7dff;
        --green: #00e5a0;
        --mono: "JetBrains Mono", monospace;
        --sans: "Syne", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 32px 20px;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 82% 18%, rgba(108, 71, 255, 0.13), transparent 34rem),
          radial-gradient(ellipse at 12% 88%, rgba(0, 229, 160, 0.07), transparent 30rem),
          var(--bg);
        color: var(--text);
        font-family: var(--mono);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
        content: "";
        pointer-events: none;
      }

      .page {
        width: min(100%, 520px);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 48px;
        color: var(--text);
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        text-decoration: none;
      }

      .brand-icon {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid rgba(157, 125, 255, 0.25);
        border-radius: 11px;
        background: rgba(108, 71, 255, 0.12);
        color: var(--accent2);
      }

      .error-code {
        margin: 0;
        background: linear-gradient(120deg, var(--accent2) 12%, #c4b0ff 48%, var(--green) 92%);
        background-clip: text;
        color: transparent;
        font-size: clamp(100px, 26vw, 168px);
        font-weight: 700;
        letter-spacing: -0.12em;
        line-height: 0.95;
        -webkit-background-clip: text;
      }

      .card {
        margin-top: 30px;
        padding: 34px 32px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background:
          linear-gradient(135deg, rgba(108, 71, 255, 0.055), rgba(0, 229, 160, 0.02)),
          rgba(13, 13, 26, 0.88);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--accent2);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(0, 229, 160, 0.7);
        content: "";
      }

      .page-title {
        margin: 16px 0 10px;
        font-family: var(--sans);
        font-size: clamp(25px, 6vw, 34px);
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .page-sub {
        max-width: 370px;
        margin: 0 auto;
        color: var(--text2);
        font-size: 13px;
        line-height: 1.8;
      }

      .btn-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .btn {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 18px;
        border: 1px solid var(--border2);
        border-radius: 10px;
        color: var(--text2);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition:
          border-color 0.18s ease,
          background 0.18s ease,
          color 0.18s ease,
          transform 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent2);
        outline-offset: 3px;
      }

      .btn-primary {
        border-color: transparent;
        background: linear-gradient(110deg, var(--accent), #825fff);
        color: #fff;
        box-shadow: 0 6px 22px rgba(108, 71, 255, 0.24);
      }

      .btn-ghost {
        background: transparent;
      }

      .btn-primary:hover {
        background: linear-gradient(110deg, #7d5cff, #9478ff);
      }

      .btn-ghost:hover {
        border-color: rgba(157, 125, 255, 0.5);
        background: var(--bg3);
        color: var(--text);
      }

      .footer-note {
        margin-top: 28px;
        color: var(--text3);
        font-size: 10px;
      }

      .footer-note span {
        color: var(--green);
      }

      @media (max-width: 480px) {
        .brand {
          margin-bottom: 36px;
        }

        .card {
          margin-top: 22px;
          padding: 28px 20px;
        }

        .btn-row {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="/" aria-label="Cashero AI home">
        <span class="brand-icon" aria-hidden="true">
          <i class="fa-solid fa-layer-group"></i>
        </span>
        <span>Cashero AI</span>
      </a>

      <p class="error-code" aria-label="Error 404">404</p>

      <section class="card" aria-labelledby="page-title">
        <div class="eyebrow">Page not found</div>
        <h1 class="page-title" id="page-title">Looks like a dead end.</h1>
        <p class="page-sub">
          We couldn't find the page you're looking for. It may have moved, or the link might be out of date.
        </p>
      </section>

      <nav class="btn-row" aria-label="Page navigation">
        <a href="/" class="btn btn-primary">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
          Back to dashboard
        </a>
        <button type="button" class="btn btn-ghost" onclick="history.back()">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          Go back
        </button>
      </nav>

      <p class="footer-note">ERROR <span>404</span> <span aria-hidden="true">/</span> Cashero AI</p>
    </main>
  </body>
</html>
