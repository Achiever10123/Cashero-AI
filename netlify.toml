[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com https://api.openai.com"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-UA-Compatible = "IE=edge"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Vary = "Accept-Encoding"

# HTML files - Cache for 24 hours
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "text/html; charset=UTF-8"
    Vary = "Accept-Encoding"

# CSS and JavaScript - Cache for 1 month
[[headers]]
  for = "/*.{js,css}"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    Vary = "Accept-Encoding"

# Images - Cache for 1 month
[[headers]]
  for = "/assets/**/*.{jpg,jpeg,png,gif,svg,webp,ico}"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    Vary = "Accept-Encoding"

# Fonts - Cache for 1 year
[[headers]]
  for = "/**/*.{woff,woff2,ttf,eot,otf}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

# Manifest and sitemap files
[[headers]]
  for = "/{sitemap.xml,robots.txt,*.webmanifest}"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/json"
    Vary = "Accept-Encoding"

# Redirect for sitemap
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

# Add Gzip compression
[build]
  publish = "."
  command = ""